    <div id="hero">
      <h1>Kontakt</h1>
      <p>Har du frågor eller synpunkter? Kontakta oss så återkommer vi så snart vi kan.</p>
    </div>
  </header>
  <main>
    <section id="contact">
      <h2>Skicka ett meddelande</h2>
      <form action="#" method="POST">
        <div class="form-group">
          <label for="name">Namn</label>
          <input type="text" id="name" name="name" placeholder="Skriv ditt namn här" required>
        </div>
        <div class="form-group">
          <label for="email">E-post</label>
          <input type="email" id="email" name="email" placeholder="Skriv din e-postadress här" required>
        </div>
        <div class="form-group">
          <label for="subject">Ämne</label>
          <input type="text" id="subject" name="subject" placeholder="Skriv in ämnet för ditt meddelande" required>
        </div>
        <div class="form-group">
          <label for="message">Meddelande</label>
          <textarea id="message" name="message" placeholder="Skriv ditt meddelande här" required></textarea>
        </div>
        <button type="submit" class="button">Skicka</button>
      </form>
    </section>
  </main>
  <footer>
    <p>&copy; Youthwashing - Ungdomsrörelsen</p>
  </footer>
